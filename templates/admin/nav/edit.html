{{ define "admin/nav/edit.html" }}
{{ template "admin/public/page_header.html" .}}



<div class="panel panel-default">
    <div class="panel-heading">
       编辑导航
    </div>
    <div class="panel-body">
        <div class="table-responsive input-form">
            <form action="/admin/nav/doEdit" method="post">
                <input type="hidden" name="id" value="{{.nav.Id}}">
                <ul>
                    <li> <span>导航名称:</span> <input type="text" name="title" value="{{.nav.Title}}"/></li>

                    <li> <span>导航位置: </span>

                        <select name="position" id="position">
                            <option value="1" {{if eq .nav.Position 1}}selected{{end}}>顶部</option>
                            <option value="2" {{if eq .nav.Position 2}}selected{{end}}>中间</option>
                            <option value="3" {{if eq .nav.Position 3}}selected{{end}}>底部</option>
                        </select>
                    </li>

                    <li> <span>关联商品:</span> <input type="text" name="relation" class="input" value="{{.nav.Relation}}"/></li>

                    <li> <span>导航链接地址:</span> <input type="text" name="link" value="{{.nav.Link}}"/></li>

                    <li> <span>新窗口打开: </span>
                        <select name="is_opennew" id="is_opennew">
                            <option value="1" {{if eq .nav.IsOpennew 1}}selected{{end}}>是</option>
                            <option value="2" {{if eq .nav.IsOpennew 2}}selected{{end}}>否</option>
                        </select>

                    <li> <span>排序:</span> <input type="text" name="sort" value="{{.nav.Sort}}" /></li>

                    <li> <span>状态: </span> 
                        <input type="radio" name="status" {{if eq .nav.Status 1}}checked{{end}} value="1" id="a" /> 
                        <label for="a">显示</label> 
                        <input type="radio" name="status" {{if eq .nav.Status 0}}checked{{end}} value="0" id="b" />
                        <label for="b">隐藏</label> 
                    </li>


                    <li>
                        <br />
                        <button type="submit" class="btn btn-primary">提交</button>
                    </li>

                </ul>
            </form>
        </div>
    </div>


</div>


</body>

</html>

{{end}}
